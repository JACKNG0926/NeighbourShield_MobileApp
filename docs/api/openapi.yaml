components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+\z
          maxLength: 150
        role:
          enum:
          - resident
          - volunteer
          - security
          - admin
          type: string
          readOnly: true
        phone_number:
          type: string
          maxLength: 15
        unit_address:
          type: string
          maxLength: 255
        area:
          type: integer
          nullable: true
        residence:
          type: integer
          nullable: true
        is_volunteer_opted_in:
          type: boolean
        is_verified_volunteer:
          type: boolean
          readOnly: true
      required:
      - username
    Area:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        center_latitude:
          type: string
          format: decimal
          multipleOf: 1.0e-06
          maximum: 1000
          minimum: -1000
          nullable: true
        center_longitude:
          type: string
          format: decimal
          multipleOf: 1.0e-06
          maximum: 1000
          minimum: -1000
          nullable: true
        radius_m:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          nullable: true
      required:
      - name
    Property:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        area:
          type: integer
        unit_number:
          type: string
          maxLength: 100
        address_line:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 20
        property_type:
          enum:
          - house
          - apartment
          - townhouse
          - other
          type: string
        latitude:
          type: string
          format: decimal
          multipleOf: 1.0e-06
          maximum: 1000
          minimum: -1000
          nullable: true
        longitude:
          type: string
          format: decimal
          multipleOf: 1.0e-06
          maximum: 1000
          minimum: -1000
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        resident_count:
          type: integer
          readOnly: true
      required:
      - area
      - unit_number
      - address_line
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fcm_token:
          type: string
          writeOnly: true
        platform:
          enum:
          - android
          - ios
          - web
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
      required:
      - fcm_token
    Incident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: object
          properties:
            id:
              type: integer
              readOnly: true
            username:
              type: string
              description: Required. 150 characters or fewer. Letters, digits and
                @/./+/-/_ only.
              pattern: ^[\w.@+-]+\z
              maxLength: 150
            role:
              enum:
              - resident
              - volunteer
              - security
              - admin
              type: string
              readOnly: true
            phone_number:
              type: string
              maxLength: 15
            unit_address:
              type: string
              maxLength: 255
            area:
              type: integer
              nullable: true
            residence:
              type: integer
              nullable: true
            is_volunteer_opted_in:
              type: boolean
            is_verified_volunteer:
              type: boolean
              readOnly: true
          required:
          - username
          readOnly: true
        latitude:
          type: string
          format: decimal
          multipleOf: 1.0e-06
          maximum: 1000
          minimum: -1000
